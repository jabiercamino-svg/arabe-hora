<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards Árabe – Las Horas</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #e8e0d0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 48px;
    }

    h1 {
      font-family: Arial, sans-serif;
      font-size: 42px;
      font-weight: 700;
      color: #f0c070;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 300;
      color: #8a8090;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 28px;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 10px 28px;
      border-radius: 30px;
      border: 1px solid #3a3050;
      background: transparent;
      color: #e8e0d0;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #2a2045;
      border-color: #f0c070;
      color: #f0c070;
    }

    .btn:active { transform: scale(0.97); }

    .btn.active {
      background: #f0c070;
      color: #1a1a2e;
      border-color: #f0c070;
    }

    .card-wrap {
      width: 100%;
      max-width: 620px;
      height: 360px;
      perspective: 1200px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(.4,0,.2,1);
    }

    .card-inner.flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 36px;
      text-align: center;
    }

    .face.front {
      background: #12122a;
      border: 1px solid #2e2850;
    }

    .face.back {
      background: #1e1840;
      border: 1px solid #f0c070;
      transform: rotateY(180deg);
    }

    .clock-number {
      font-size: 80px;
      font-weight: 700;
      color: #f0c070;
      letter-spacing: 4px;
      line-height: 1;
    }

    .hint {
      font-size: 12px;
      color: #4a4060;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .arabic-back {
      font-family: Arial, sans-serif;
      font-size: 32px;
      direction: rtl;
      color: #f0c070;
      line-height: 1.4;
    }

    .pronunciation {
      font-size: 16px;
      font-style: italic;
      color: #a090c0;
      font-weight: 300;
      line-height: 1.5;
    }

    .meaning {
      font-size: 20px;
      font-weight: 700;
      color: #e8e0d0;
    }

    .help {
      margin-top: 24px;
      font-size: 11px;
      color: #3a3050;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }

    @media (max-width: 500px) {
      .clock-number { font-size: 58px; }
      .arabic-back { font-size: 24px; }
      .card-wrap { height: 320px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>

  <div class="subtitle">Flashcards · Las horas en árabe</div>

  <div class="controls">
    <button class="btn" onclick="prevCard()">⬅ Anterior</button>
    <button class="btn" onclick="flipCard()">🔄 Girar</button>
    <button class="btn" onclick="nextCard()">Siguiente ➡</button>
    <button class="btn" id="randomBtn" onclick="toggleRandom()">🔀 Aleatorio: NO</button>
    <button class="btn" onclick="shuffleCards()">⇄ Mezclar</button>
  </div>

  <div class="card-wrap" onclick="flipCard()">
    <div class="card-inner" id="card-inner">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>

    ];

    let cards = [...hours];
    let current = 0;
    let randomMode = false;

    function renderCard() {
      const frontEl = document.getElementById('front');
      const backEl  = document.getElementById('back');
      document.getElementById('card-inner').classList.remove('flipped');

      const c = cards[current];

      frontEl.innerHTML = `
        <div class="clock-number">${c.time}</div>
        <div class="hint">toca para ver en árabe</div>
      `;

      backEl.innerHTML = `
        <div class="arabic-back">${c.arabic}</div>
        <div class="pronunciation">${c.roman}</div>
        <div class="meaning">${c.meaning}</div>
      `;
    }

    function flipCard() {
      document.getElementById('card-inner').classList.toggle('flipped');
    }

    function nextCard() {
      current = randomMode
        ? Math.floor(Math.random() * cards.length)
        : (current + 1) % cards.length;
      renderCard();
    }

    function prevCard() {
      current = randomMode
        ? Math.floor(Math.random() * cards.length)
        : (current - 1 + cards.length) % cards.length;
      renderCard();
    }

    function shuffleCards() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      current = 0;
      renderCard();
    }

    function toggleRandom() {
      randomMode = !randomMode;
      const btn = document.getElementById('randomBtn');
      btn.textContent = `🔀 Aleatorio: ${randomMode ? 'SÍ' : 'NO'}`;
      btn.classList.toggle('active', randomMode);
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); flipCard(); }
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft') prevCard();
    });

    renderCard();
  </script>

</body>
</html>
